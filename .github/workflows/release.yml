name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Título da Release'
        required: false
        default: 'Floria-selfhub v1.0.0'
      release_notes:
        description: 'Notas da versão / Texto da Release'
        required: false
        default: 'Melhorias gerais e correções de bugs.'
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependências do Node
        run: npm install

      - name: Compilar aplicação e criar Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: ${{ inputs.release_name || format('Floria-selfhub {0}', github.ref_name) }}
          releaseBody: ${{ inputs.release_notes || 'Nova versão lançada automaticamente pelo GitHub Actions.' }}
          releaseDraft: false
          prerelease: false
