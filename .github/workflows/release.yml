name: Publish Release

on:
  push:
    tags:
      - 'v*' # É ativado quando envias tags como v1.0.0, v1.1.0, etc.

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependências do Node
        run: npm install

      - name: Compilar aplicação e criar Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Floria-selfhub ${{ github.ref_name }}'
          releaseBody: 'Nova versão lançada automaticamente pelo GitHub Actions.'
          releaseDraft: false
          prerelease: false