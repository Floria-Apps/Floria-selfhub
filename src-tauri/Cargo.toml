[package]
name = "selfhub"
version = "0.1.0"
description = "Painel em abas para as APIs dos seus apps self-host"
edition = "2021"

[lib]
name = "selfhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# dangerous-settings permite aceitar certificados HTTPS autoassinados (opção do modal)
tauri-plugin-http = { version = "2", features = ["dangerous-settings"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
